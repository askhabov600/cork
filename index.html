<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор рассрочки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #F6F6F2;
    --card: #FFFFFF;
    --field: #F4F3EE;
    --ink: #16160F;
    --ink-60: #82817A;
    --line: #EBEAE3;
    --accent: #0F6B4C;
    --accent-soft: #EAF4EE;
    --accent-line: #D8EADF;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--page);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 40px 18px;
    -webkit-font-smoothing: antialiased;
  }

  .card{
    width:100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 30px 26px 28px;
    box-shadow: 0 1px 2px rgba(20,20,15,.04), 0 32px 64px -32px rgba(20,20,15,.22);
  }

  h1{
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
  }

  /* segmented tabs */
  .switch{
    position: relative;
    display:flex;
    background: var(--field);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .switch-indicator{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width: calc(50% - 4px);
    background:#fff;
    border-radius: 11px;
    box-shadow: 0 1px 3px rgba(20,20,15,.10);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .switch.mode-without .switch-indicator{ transform: translateX(100%); }
  .tab{
    position:relative; z-index:1;
    flex:1;
    border:none; background:none;
    padding: 11px 6px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-60);
    cursor:pointer;
    transition: color .2s ease;
  }
  .tab.active{ color: var(--ink); }

  /* fields */
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-60);
    margin-bottom: 7px;
  }
  .field-box{
    display:flex; align-items:center;
    background: var(--field);
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 0 16px;
    height: 52px;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .field-box:focus-within{
    border-color: var(--accent);
    background:#fff;
    box-shadow: 0 0 0 4px rgba(15,107,76,0.08);
  }
  .field-box input{
    flex:1;
    border:none; outline:none; background:transparent;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    padding:0;
    width:100%;
    min-width: 0;
  }
  .field-box .unit{
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-60);
    padding-left: 8px;
    flex-shrink: 0;
  }
  #dp-field.hidden{ display:none; }

  .divider{
    height: 1px;
    background: var(--line);
    margin: 22px 0 22px;
  }

  /* result panel */
  .result{
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-radius: 20px;
    padding: 22px 20px 6px;
  }
  .result .total-label{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-60);
    margin-bottom: 5px;
  }
  .result .total{
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }
  .result .total .cur{
    font-size: 0.48em;
    font-weight: 600;
    color: var(--ink-60);
    margin-left: 4px;
  }
  .row{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-top: 1px solid rgba(15,107,76,0.12);
    font-size: 13.5px;
  }
  .row span:first-child{ color: var(--ink-60); font-weight: 500; }
  .row span:last-child{
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .y-hint{
    display:flex;
    justify-content:flex-end;
    gap: 6px;
    align-items: baseline;
    margin-top: 12px;
    padding: 0 2px;
  }
  .y-hint span:first-child{
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--ink-60);
    opacity: .6;
  }
  .y-hint span:last-child{
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-60);
    opacity: .6;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 360px){
    .result .total{ font-size: 33px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>Калькулятор рассрочки</h1>

  <div class="switch" id="switch">
    <span class="switch-indicator"></span>
    <button class="tab active" data-mode="with">С первым взносом</button>
    <button class="tab" data-mode="without">Без взноса</button>
  </div>

  <div class="field">
    <label for="cost">Стоимость товара</label>
    <div class="field-box">
      <input id="cost" type="text" inputmode="numeric" value="10.000">
      <span class="unit">₽</span>
    </div>
  </div>

  <div class="field">
    <label for="months">Срок рассрочки</label>
    <div class="field-box">
      <input id="months" type="number" min="1" max="24" value="3">
      <span class="unit">мес.</span>
    </div>
  </div>

  <div class="field" id="dp-field">
    <label for="dp">Первоначальный взнос</label>
    <div class="field-box">
      <input id="dp" type="text" inputmode="numeric" value="0">
      <span class="unit">₽</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="result">
    <div class="total-label">Итоговая стоимость</div>
    <div class="total"><span id="out-total">0</span><span class="cur">₽</span></div>

    <div class="row"><span>Первоначальный взнос</span><span id="out-dp">—</span></div>
    <div class="row"><span>Ежемесячный платёж</span><span id="out-monthly">—</span></div>
    <div class="row"><span>Переплата в месяц</span><span id="out-overpay-month">—</span></div>
    <div class="row"><span>Вся переплата</span><span id="out-overpay-total">—</span></div>

    <div class="y-hint"><span>Y</span><span id="out-y">0%</span></div>
  </div>
</div>

<script>
function round50(n)  { return Math.round(n / 50) * 50; }
function round100(n) { return Math.round(n / 100) * 100; }

function calc(cost, months, mode, dp) {
  // Фиксированная надбавка: 4.2% (0.042) со взносом, 4% (0.04) без взноса
  var rate = mode === 'with' ? 0.042 : 0.04;
  
  var blank = dp === null;
  var suggestedDp = suggestDp(cost, months, mode);
  var enteredDp = blank ? suggestedDp : dp;
  
  // Взнос не может превышать стоимость товара
  if (enteredDp > cost) enteredDp = cost;

  // Вычитаем взнос из суммы стоимости товара
  var financedAmount = Math.max(0, cost - enteredDp);
  
  // Делаем надбавку на оставшуюся сумму
  var totalFinanced = financedAmount + (financedAmount * rate * months);
  
  // Ежемесячный платеж (округление до 50)
  var basePayment = months > 0 ? totalFinanced / months : 0;
  var monthly = round50(basePayment);
  
  // Итоговая сумма складывается из внесенного ПВ и округленных платежей
  var total = enteredDp + (monthly * months);
  
  var overpayTotal = total - cost;
  if (overpayTotal < 0) overpayTotal = 0; // На случай если округление ушло в минус при 0 стоимости
  
  var overpayMonth = months > 0 ? overpayTotal / months : 0;
  var y = cost !== 0 ? overpayTotal / cost : 0;

  return { dp: enteredDp, monthly: monthly, total: total, overpayTotal: overpayTotal, overpayMonth: overpayMonth, y: y };
}

function suggestDp(cost, months, mode) {
  // Предлагаемый взнос по умолчанию (20% от стоимости товара, округлено до 50)
  return mode === 'with' ? round50(cost * 0.2) : 0;
}

// -------- formatting --------
function money(n) {
  return Math.round(n).toLocaleString('ru-RU').replace(/\u00A0/g, '.');
}
function digitsOnly(str) {
  return (str || '').replace(/\D/g, '');
}
function readAmount(input) {
  return Number(digitsOnly(input.value)) || 0;
}
function writeAmount(input, n) {
  input.value = n > 0 ? money(n) : '0';
}
function bindThousands(input, onChange) {
  input.addEventListener('input', function () {
    var pos = input.selectionStart;
    var before = input.value.length;
    var raw = digitsOnly(input.value).replace(/^0+(?=\d)/, '');
    input.value = raw === '' ? '' : money(Number(raw));
    var diff = input.value.length - before;
    input.setSelectionRange(pos + diff, pos + diff);
    onChange();
  });
}

// -------- wiring --------
var costEl = document.getElementById('cost');
var monthsEl = document.getElementById('months');
var dpEl = document.getElementById('dp');
var dpField = document.getElementById('dp-field');
var switchEl = document.getElementById('switch');
var tabButtons = document.querySelectorAll('.tab');

var mode = 'with';
var dpTouched = false;

function refreshDpPlaceholder() {
  if (dpTouched) return;
  writeAmount(dpEl, suggestDp(readAmount(costEl), Number(monthsEl.value) || 1, mode));
}

function render() {
  var cost = readAmount(costEl);
  var months = Math.max(1, Number(monthsEl.value) || 1);
  var dp = dpTouched ? readAmount(dpEl) : null;
  var r = calc(cost, months, mode, dp);

  document.getElementById('out-total').textContent = money(r.total);
  document.getElementById('out-dp').textContent = money(r.dp) + ' ₽';
  document.getElementById('out-monthly').textContent = money(r.monthly) + ' ₽ × ' + months;
  document.getElementById('out-overpay-month').textContent = money(r.overpayMonth) + ' ₽';
  document.getElementById('out-overpay-total').textContent = money(r.overpayTotal) + ' ₽';
  document.getElementById('out-y').textContent = (r.y * 100).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + '%';
}

tabButtons.forEach(function (btn) {
  btn.addEventListener('click', function () {
    mode = btn.dataset.mode;
    tabButtons.forEach(function (b) { b.classList.toggle('active', b === btn); });
    switchEl.classList.toggle('mode-without', mode === 'without');
    monthsEl.value = mode === 'with' ? 3 : 6;
    dpField.classList.toggle('hidden', mode === 'without');
    dpTouched = false;
    refreshDpPlaceholder();
    render();
  });
});

bindThousands(costEl, function () { refreshDpPlaceholder(); render(); });
bindThousands(dpEl, function () { dpTouched = true; render(); });
monthsEl.addEventListener('input', function () { refreshDpPlaceholder(); render(); });

refreshDpPlaceholder();
render();
</script>
</body>
</html>
